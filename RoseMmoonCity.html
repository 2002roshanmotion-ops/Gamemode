function step(dt){if(!started||dialog||activeShop)return;let x=joy.x,y=joy.y;if(keys.ArrowLeft||keys.a)x--;if(keys.ArrowRight||keys.d)x++;if(keys.ArrowUp||keys.w)y--;if(keys.ArrowDown||keys.s)y++;let l=Math.hypot(x,y);if(l>1){x/=l;y/=l}if(l>.08){let speed=sprinting?245:150;player.x+=x*speed*dt;player.y+=y*speed*dt;player.walk+=dt*8}player.x=Math.max(40,Math.min(mapW-40,player.x));player.y=Math.max(40,Math.min(mapH-40,player.y));girls.forEach(g=>{g.phase+=dt*2;if(Math.random()<.006){g.tx=g.x+(Math.random()-.5)*130;g.ty=g.y+(Math.random()-.5)*120}if(g.tx){let dx=g.tx-g.x,dy=g.ty-g.y,dist=Math.hypot(dx,dy);if(dist>5){g.x+=dx/dist*22*dt;g.y+=dy/dist*22*dt}else g.tx=0}})}let prev=0;function frame(t){let dt=Math.min((t-prev)/1000||0,.05);prev=t;step(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
function levelCheck(){while(game.xp>=100){game.xp-=100;game.level++;game.coins+=150}}function interact(){if(!near)return;if(near.type==='girl'){if(near.n.name==='Emma'&&!game.quest){game.quest=1;game.coins+=100;game.xp+=30;levelCheck();save();dialog=true;document.querySelector('#dt').textContent='Emma · City Guide';document.querySelector('#dd').textContent='Welcome to RoseMoon City! Quest completed: Talk to Emma. You earned 100 coins and 30 XP. Go visit RoseMoon Fashion next!';document.querySelector('#dialog').style.display='block';return;}game.coins+=2;game.xp+=2;levelCheck();save();dialog=true;document.querySelector('#dt').textContent=near.n.name+' · '+near.n.role;document.querySelector('#dd').textContent=['Hi! I love the RoseMoon boutiques! 💕','The fountain is my favorite spot in town. 🌸','Welcome! Have a lovely day! ✨','I am shopping for a new outfit! 👗'][Math.floor(Math.random()*4)];document.querySelector('#dialog').style.display='block';return;}if(near.type==='store'){if(near.s.n.includes('Fashion')&&game.quest===1){game.quest=2;game.coins+=150;game.xp+=40;levelCheck();save();}activeShop=near.s;document.querySelector('#st').textContent=activeShop.n;document.querySelector('#sd').textContent=activeShop.desc+' You can walk around inside in this prototype and open the real website.';document.querySelector('#online').textContent=activeShop.n.includes('Fashion')?'VISIT ROSEMMOON FASHION ONLINE ↗':'VISIT ROSEMMOON ONLINE ↗';document.querySelector('#shop').style.display='grid'}else{dialog=true;document.querySelector('#dt').textContent=near.n.name;document.querySelector('#dd').textContent='Hi! Welcome to RoseMmoon City 🌷 Enjoy the park and explore the shops nearby!';document.querySelector('#dialog').style.display='block'}}
document.querySelector('#start').onclick=()=>{started=true;document.querySelector('#intro').style.display='none';if(innerWidth<800){document.querySelector('#pad').style.display='block';document.querySelector('#controls').style.display='flex'}dialog=true;document.querySelector('#dt').textContent='Welcome to RoseMmoon City!';document.querySelector('#dd').textContent='Walk around, meet the girls, and visit RoseMmoon Flower & Gift or RoseMmoon Fashion. Use joystick, WASD, or arrows to move. Tap INTERACT or press E near people or shops.';document.querySelector('#dialog').style.display='block'};document.querySelector('#act').onclick=interact;document.querySelector('#interact').onclick=interact;document.querySelector('#ok').onclick=()=>{dialog=false;document.querySelector('#dialog').style.display='none'};document.querySelector('#online').onclick=()=>window.open(activeShop.link,'_blank','noopener');document.querySelector('#exit').onclick=()=>{activeShop=null;document.querySelector('#shop').style.display='none'};document.querySelector('#sprint').onpointerdown=()=>sprinting=true;document.querySelector('#sprint').onpointerup=()=>sprinting=false;document.querySelector('#sprint').onpointerleave=()=>sprinting=false;addEventListener('keydown',e=>{keys[e.key]=true;if(e.key.toLowerCase()==='e')interact();if(e.key==='Escape'){dialog=false;activeShop=null;document.querySelector('#dialog').style.display='none';document.querySelector('#shop').style.display='none'}});addEventListener('keyup',e=>keys[e.key]=false);
const pad=document.querySelector('#pad'),nub=document.querySelector('#nub');pad.addEventListener('pointerdown',e=>{joy.down=true;pad.setPointerCapture(e.pointerId);stick(e)});pad.addEventListener('pointermove',e=>{if(joy.down)stick(e)});pad.addEventListener('pointerup',reset);pad.addEventListener('pointercancel',reset);function stick(e){let r=pad.getBoundingClientRect(),cx=r.width/2,cy=r.height/2,x=e.clientX-r.left-cx,y=e.clientY-r.top-cy,max=37,len=Math.hypot(x,y);if(len>max){x=x/len*max;y=y/len*max}joy.x=x/max;joy.y=y/max;nub.style.transform='translate('+x+'px,'+y+'px)'}function reset(){joy.down=false;joy.x=joy.y=0;nub.style.transform='translate(0,0)'}
})();</script></body></html>
